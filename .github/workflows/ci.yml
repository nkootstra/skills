name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Structure, frontmatter, links and eval cases
        run: python3 scripts/check.py

      # Needs no login. npm 12 blocks install scripts unless allowed, and the CLI's postinstall
      # fetches its native binary.
      - name: Install Claude Code
        run: npm install -g --allow-scripts=@anthropic-ai/claude-code @anthropic-ai/claude-code

      - name: Validate the marketplace and plugins
        run: claude plugin validate .
