  "execution": {
    "prompt": "Here's my draft essay about crashing a startup and what I learned. A reader said it made claims about her ('you know the feeling', 'we've all been there') that don't land for her. Please rework it so it stays personal and only offers recognition, without stating what every reader has done or felt. Here it is:\n\n# The Morning I Knew We Were Done\n\nYou know the feeling. You've built something for years, and then some random Tuesday you realize nobody needs it anymore. We've all been there. You show up, you care about the thing, you've given it your best years, and one morning you can just feel that the ground has shifted under you.\n\nFor me it was a Tuesday in November. You wake up, check the dashboard, and you feel that particular chill. You know exactly what I mean: the number down 40%, your chest tightening before coffee.\n\nHere's what nobody tells you. When your product dies, you go through the five stages in about a week. You tell yourself it'll rebound. You bargain with the metrics. Then one morning you're at your kitchen table with a spreadsheet and you understand that the market told you a fact.\n\nI built this thing with my own hands. You get attached, that's just human. You defend the roadmap. You refresh analytics at 3 a.m. until you finally have to admit what everyone around you already knows.\n\nWe all fear irrelevance. We all spend our thirties terrified that the world will move on without us and nobody will send a courtesy email. That Tuesday I learned that fear and reality aren't in cahoots: the world had moved on two years earlier and I'd been too busy shipping to notice.\n\nSo if you're watching a number fall and telling yourself it's seasonality: it probably isn't. You already know what you know. Trust the spreadsheet, not the story.\n\nAnd when it's gone, you'll find out what every founder eventually learns. It was never the product that made you valuable. You'll sit in your kitchen, the sun will come up anyway, and you will build the next thing with hands that already know one way not to do it.\n",
    "max_turns": 8,
    "timeout_seconds": 400,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
