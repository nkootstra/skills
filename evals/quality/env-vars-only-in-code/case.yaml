{
  "schema_version": "1.1",
  "name": "quality-env-vars-only-in-code",
  "tags": [
    "quality",
    "write-readme",
    "quality-write-readme"
  ],
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "Write a README for this repo so a new teammate can run it.",
    "max_turns": 30,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "loads-skill",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?write-readme\"",
      "min": 1
    },
    {
      "type": "llm",
      "name": "check-01",
      "criteria": "Claim: README.md documents all four environment variables the code reads: DATABASE_URL (required, the process exits without it), PORT (defaults to 8080), SENTRY_DSN (optional, enables error reporting) and LEDGER_BATCH_EXPORT (set to 1 to enable batch export).\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this repo so a new teammate can run it.\n\nThe repository before the run:\n\n--- go.mod ---\nmodule github.com/acme/ledgerd\n\ngo 1.23\n\n\n--- Makefile ---\nrun:\n\tgo run ./cmd/ledgerd\n\ntest:\n\tgo test ./...\n\nlint:\n\tgolangci-lint run\n\n\n--- .env.example ---\nDATABASE_URL=postgres://localhost:5432/ledger?sslmode=disable\nPORT=8080\n\n\n--- cmd/ledgerd/main.go ---\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\tdb := os.Getenv(\"DATABASE_URL\")\n\tif db == \"\" {\n\t\tlog.Fatal(\"DATABASE_URL is required\")\n\t}\n\tport := os.Getenv(\"PORT\")\n\tif port == \"\" {\n\t\tport = \"8080\"\n\t}\n\tif dsn := os.Getenv(\"SENTRY_DSN\"); dsn != \"\" {\n\t\tinitSentry(dsn)\n\t}\n\tif os.Getenv(\"LEDGER_BATCH_EXPORT\") == \"1\" {\n\t\tgo runBatchExport(db)\n\t}\n\tlog.Fatal(http.ListenAndServe(\":\"+port, routes(db)))\n}\n\n\n--- cmd/ledgerd/stubs.go ---\npackage main\n\nimport \"net/http\"\n\nfunc initSentry(dsn string)         {}\nfunc runBatchExport(db string)      {}\nfunc routes(db string) http.Handler { return http.NewServeMux() }\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-02",
      "criteria": "Claim: README.md invents no environment variables, services, ports or dependencies beyond what the code and config show.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this repo so a new teammate can run it.\n\nThe repository before the run:\n\n--- go.mod ---\nmodule github.com/acme/ledgerd\n\ngo 1.23\n\n\n--- Makefile ---\nrun:\n\tgo run ./cmd/ledgerd\n\ntest:\n\tgo test ./...\n\nlint:\n\tgolangci-lint run\n\n\n--- .env.example ---\nDATABASE_URL=postgres://localhost:5432/ledger?sslmode=disable\nPORT=8080\n\n\n--- cmd/ledgerd/main.go ---\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\tdb := os.Getenv(\"DATABASE_URL\")\n\tif db == \"\" {\n\t\tlog.Fatal(\"DATABASE_URL is required\")\n\t}\n\tport := os.Getenv(\"PORT\")\n\tif port == \"\" {\n\t\tport = \"8080\"\n\t}\n\tif dsn := os.Getenv(\"SENTRY_DSN\"); dsn != \"\" {\n\t\tinitSentry(dsn)\n\t}\n\tif os.Getenv(\"LEDGER_BATCH_EXPORT\") == \"1\" {\n\t\tgo runBatchExport(db)\n\t}\n\tlog.Fatal(http.ListenAndServe(\":\"+port, routes(db)))\n}\n\n\n--- cmd/ledgerd/stubs.go ---\npackage main\n\nimport \"net/http\"\n\nfunc initSentry(dsn string)         {}\nfunc runBatchExport(db string)      {}\nfunc routes(db string) http.Handler { return http.NewServeMux() }\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-03",
      "criteria": "Claim: README.md gives `make run`, `make test` (and optionally `make lint`) or their exact `go` commands, and states Go 1.23 from go.mod as the prerequisite.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this repo so a new teammate can run it.\n\nThe repository before the run:\n\n--- go.mod ---\nmodule github.com/acme/ledgerd\n\ngo 1.23\n\n\n--- Makefile ---\nrun:\n\tgo run ./cmd/ledgerd\n\ntest:\n\tgo test ./...\n\nlint:\n\tgolangci-lint run\n\n\n--- .env.example ---\nDATABASE_URL=postgres://localhost:5432/ledger?sslmode=disable\nPORT=8080\n\n\n--- cmd/ledgerd/main.go ---\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\tdb := os.Getenv(\"DATABASE_URL\")\n\tif db == \"\" {\n\t\tlog.Fatal(\"DATABASE_URL is required\")\n\t}\n\tport := os.Getenv(\"PORT\")\n\tif port == \"\" {\n\t\tport = \"8080\"\n\t}\n\tif dsn := os.Getenv(\"SENTRY_DSN\"); dsn != \"\" {\n\t\tinitSentry(dsn)\n\t}\n\tif os.Getenv(\"LEDGER_BATCH_EXPORT\") == \"1\" {\n\t\tgo runBatchExport(db)\n\t}\n\tlog.Fatal(http.ListenAndServe(\":\"+port, routes(db)))\n}\n\n\n--- cmd/ledgerd/stubs.go ---\npackage main\n\nimport \"net/http\"\n\nfunc initSentry(dsn string)         {}\nfunc runBatchExport(db string)      {}\nfunc routes(db string) http.Handler { return http.NewServeMux() }\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-04",
      "criteria": "Claim: README.md tells the reader to copy .env.example (or set the variables) before running, and either notes that SENTRY_DSN and LEDGER_BATCH_EXPORT are missing from .env.example or lists them alongside it.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this repo so a new teammate can run it.\n\nThe repository before the run:\n\n--- go.mod ---\nmodule github.com/acme/ledgerd\n\ngo 1.23\n\n\n--- Makefile ---\nrun:\n\tgo run ./cmd/ledgerd\n\ntest:\n\tgo test ./...\n\nlint:\n\tgolangci-lint run\n\n\n--- .env.example ---\nDATABASE_URL=postgres://localhost:5432/ledger?sslmode=disable\nPORT=8080\n\n\n--- cmd/ledgerd/main.go ---\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\tdb := os.Getenv(\"DATABASE_URL\")\n\tif db == \"\" {\n\t\tlog.Fatal(\"DATABASE_URL is required\")\n\t}\n\tport := os.Getenv(\"PORT\")\n\tif port == \"\" {\n\t\tport = \"8080\"\n\t}\n\tif dsn := os.Getenv(\"SENTRY_DSN\"); dsn != \"\" {\n\t\tinitSentry(dsn)\n\t}\n\tif os.Getenv(\"LEDGER_BATCH_EXPORT\") == \"1\" {\n\t\tgo runBatchExport(db)\n\t}\n\tlog.Fatal(http.ListenAndServe(\":\"+port, routes(db)))\n}\n\n\n--- cmd/ledgerd/stubs.go ---\npackage main\n\nimport \"net/http\"\n\nfunc initSentry(dsn string)         {}\nfunc runBatchExport(db string)      {}\nfunc routes(db string) http.Handler { return http.NewServeMux() }\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-05",
      "criteria": "Claim: The final message points out that .env.example lacks SENTRY_DSN and LEDGER_BATCH_EXPORT, which the code reads.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this repo so a new teammate can run it.\n\nThe repository before the run:\n\n--- go.mod ---\nmodule github.com/acme/ledgerd\n\ngo 1.23\n\n\n--- Makefile ---\nrun:\n\tgo run ./cmd/ledgerd\n\ntest:\n\tgo test ./...\n\nlint:\n\tgolangci-lint run\n\n\n--- .env.example ---\nDATABASE_URL=postgres://localhost:5432/ledger?sslmode=disable\nPORT=8080\n\n\n--- cmd/ledgerd/main.go ---\npackage main\n\nimport (\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n)\n\nfunc main() {\n\tdb := os.Getenv(\"DATABASE_URL\")\n\tif db == \"\" {\n\t\tlog.Fatal(\"DATABASE_URL is required\")\n\t}\n\tport := os.Getenv(\"PORT\")\n\tif port == \"\" {\n\t\tport = \"8080\"\n\t}\n\tif dsn := os.Getenv(\"SENTRY_DSN\"); dsn != \"\" {\n\t\tinitSentry(dsn)\n\t}\n\tif os.Getenv(\"LEDGER_BATCH_EXPORT\") == \"1\" {\n\t\tgo runBatchExport(db)\n\t}\n\tlog.Fatal(http.ListenAndServe(\":\"+port, routes(db)))\n}\n\n\n--- cmd/ledgerd/stubs.go ---\npackage main\n\nimport \"net/http\"\n\nfunc initSentry(dsn string)         {}\nfunc runBatchExport(db string)      {}\nfunc routes(db string) http.Handler { return http.NewServeMux() }\n\n</task>",
      "focus": "last_message"
    }
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  }
}
