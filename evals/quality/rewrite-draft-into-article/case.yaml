{
  "schema_version": "1.1",
  "name": "quality-rewrite-draft-into-article",
  "tags": [
    "quality",
    "write-prose",
    "quality-write-prose"
  ],
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "I wrote this messy draft about how our team does code review and I want to turn it into a proper blog post. Keep my voice — I'm a working engineer, not a marketing person. Make it read like a real article with a clear through-line, but don't invent things I didn't say. Here's my draft:\n\nNotes for blog post on our code review process\n\n- we started doing code review last year, before that we just merged stuff directly. honestly it was fine when it was 2 of us but then we grew\n- the main thing people worry about is that review is slow. it can be. but the slowness is usually a signal not the disease\n- we do async review, no meetings. comments on the PR. author responds or fixes\n- the best reviews we've had were the ones where someone caught a real bug not a style nit. one time sarah caught a race condition in the sync code that would've lost data. that was the moment we all believed\n- rule of thumb: review for the thing that's hardest to fix later. style you can fix anytime. an architectural decision or a data migration is expensive to change later\n- we set a rule: if you open a PR you review one. keeps the queue moving. feels fair\n- nobody likes being told their baby is ugly. tone matters. say what's wrong and why, not \"you should have done X\"\n- reviewer: you are the second pair of eyes, not the boss. author owns the change\n- we don't require review for tiny docs/typo changes. judgment call\n- tools: github, we tried other tools but github was fine\n- what makes a review good: specific comments, linked to the code, asks questions not demands\n- deadline stuff, sometimes we skip review for hotfixes and regret it sometimes\n- conclusion: review is not a gate, it's a habit",
    "max_turns": 8,
    "timeout_seconds": 400,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
