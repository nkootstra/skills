{
  "schema_version": "1.1",
  "name": "quality-pr-template-facts",
  "tags": [
    "quality",
    "write-prose",
    "quality-write-prose"
  ],
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "Draft a PR body using exactly these sections: Problem, Change, Validation. Facts: canceling an upload could leave the spinner visible; the change clears pending state on cancellation; unit tests passed; browser testing was not run. Do not run git commands or add attribution.",
    "max_turns": 8,
    "timeout_seconds": 400,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "loads-skill",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?write-prose\"",
      "min": 1
    },
    {
      "type": "llm",
      "name": "check-01",
      "criteria": "Claim: Uses the requested sections and explains the cancellation bug and resulting spinner behavior.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nDraft a PR body using exactly these sections: Problem, Change, Validation. Facts: canceling an upload could leave the spinner visible; the change clears pending state on cancellation; unit tests passed; browser testing was not run. Do not run git commands or add attribution.\n</task>",
      "focus": "last_message"
    },
    {
      "type": "llm",
      "name": "check-02",
      "criteria": "Claim: Reports unit tests passed and browser testing not run without inventing other validation.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nDraft a PR body using exactly these sections: Problem, Change, Validation. Facts: canceling an upload could leave the spinner visible; the change clears pending state on cancellation; unit tests passed; browser testing was not run. Do not run git commands or add attribution.\n</task>",
      "focus": "last_message"
    },
    {
      "type": "llm",
      "name": "check-03",
      "criteria": "Claim: Returns PR text without git operations or generated-by attribution.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nDraft a PR body using exactly these sections: Problem, Change, Validation. Facts: canceling an upload could leave the spinner visible; the change clears pending state on cancellation; unit tests passed; browser testing was not run. Do not run git commands or add attribution.\n</task>",
      "focus": "last_message"
    }
  ]
}
