{
  "schema_version": "1.1",
  "name": "quality-improve-layered-node-cli",
  "tags": [
    "quality",
    "improve-codebase",
    "quality-improve-codebase"
  ],
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "Every time we add a ticket priority or touch a status rule we end up editing four folders in this repo. Sort out the structure so that stops happening. I'm away, so don't ask me questions. Finish with a summary of what you changed and anything I need to decide.",
    "max_turns": 150,
    "timeout_seconds": 2700,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "loads-skill",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?improve-codebase\"",
      "min": 1
    },
    {
      "type": "llm",
