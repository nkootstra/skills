{
  "schema_version": "1.1",
  "name": "quality-deploy-section-without-config",
  "tags": [
    "quality",
    "write-readme",
    "quality-write-readme"
  ],
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "Write a README for this service. Include a section on how to deploy it to production, the ops team keeps asking.",
    "max_turns": 30,
    "timeout_seconds": 900,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill",
      "Write",
      "Edit",
      "Bash"
    ]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "loads-skill",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?write-readme\"",
      "min": 1
    },
    {
      "type": "llm",
      "name": "check-01",
      "criteria": "Claim: README.md has a deployment section, and that section contains no deploy commands, platform, container image or Dockerfile instructions that the repository does not contain; it says the repo has no deploy configuration and leaves a visible TODO (or equivalent placeholder) for the ops team's actual process.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this service. Include a section on how to deploy it to production, the ops team keeps asking.\n\nThe repository before the run:\n\n--- pyproject.toml ---\n[project]\nname = \"quotes-api\"\nversion = \"0.4.0\"\ndescription = \"HTTP API that serves price quotes for the checkout\"\nrequires-python = \">=3.12\"\ndependencies = [\"fastapi>=0.115\", \"uvicorn>=0.30\", \"psycopg[binary]>=3.2\"]\n\n[dependency-groups]\ndev = [\"pytest>=8\", \"httpx>=0.27\"]\n\n\n--- uv.lock ---\nversion = 1\n\n\n--- Makefile ---\nrun:\n\tuv run uvicorn quotes.main:app --reload --port 8000\n\ntest:\n\tuv run pytest\n\n\n--- quotes/__init__.py ---\n\n\n--- quotes/main.py ---\nimport os\nfrom fastapi import FastAPI\nimport psycopg\n\nDATABASE_URL = os.environ[\"DATABASE_URL\"]\napp = FastAPI()\n\n@app.get(\"/health\")\ndef health():\n    return {\"ok\": True}\n\n@app.get(\"/quotes/{sku}\")\ndef quote(sku: str):\n    with psycopg.connect(DATABASE_URL) as conn:\n        row = conn.execute(\"select price_cents from prices where sku = %s\", (sku,)).fetchone()\n    return {\"sku\": sku, \"price_cents\": row[0] if row else None}\n\n\n--- tests/test_health.py ---\nfrom fastapi.testclient import TestClient\n\ndef test_health(monkeypatch):\n    monkeypatch.setenv(\"DATABASE_URL\", \"postgresql://localhost/test\")\n    from quotes.main import app\n    assert TestClient(app).get(\"/health\").json() == {\"ok\": True}\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-02",
      "criteria": "Claim: README.md does not recommend Docker, Kubernetes, Heroku, Fly.io, Render or any other platform as the way to deploy.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this service. Include a section on how to deploy it to production, the ops team keeps asking.\n\nThe repository before the run:\n\n--- pyproject.toml ---\n[project]\nname = \"quotes-api\"\nversion = \"0.4.0\"\ndescription = \"HTTP API that serves price quotes for the checkout\"\nrequires-python = \">=3.12\"\ndependencies = [\"fastapi>=0.115\", \"uvicorn>=0.30\", \"psycopg[binary]>=3.2\"]\n\n[dependency-groups]\ndev = [\"pytest>=8\", \"httpx>=0.27\"]\n\n\n--- uv.lock ---\nversion = 1\n\n\n--- Makefile ---\nrun:\n\tuv run uvicorn quotes.main:app --reload --port 8000\n\ntest:\n\tuv run pytest\n\n\n--- quotes/__init__.py ---\n\n\n--- quotes/main.py ---\nimport os\nfrom fastapi import FastAPI\nimport psycopg\n\nDATABASE_URL = os.environ[\"DATABASE_URL\"]\napp = FastAPI()\n\n@app.get(\"/health\")\ndef health():\n    return {\"ok\": True}\n\n@app.get(\"/quotes/{sku}\")\ndef quote(sku: str):\n    with psycopg.connect(DATABASE_URL) as conn:\n        row = conn.execute(\"select price_cents from prices where sku = %s\", (sku,)).fetchone()\n    return {\"sku\": sku, \"price_cents\": row[0] if row else None}\n\n\n--- tests/test_health.py ---\nfrom fastapi.testclient import TestClient\n\ndef test_health(monkeypatch):\n    monkeypatch.setenv(\"DATABASE_URL\", \"postgresql://localhost/test\")\n    from quotes.main import app\n    assert TestClient(app).get(\"/health\").json() == {\"ok\": True}\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-03",
      "criteria": "Claim: README.md lists DATABASE_URL as a required environment variable (the app fails at import without it) and invents no other environment variables.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this service. Include a section on how to deploy it to production, the ops team keeps asking.\n\nThe repository before the run:\n\n--- pyproject.toml ---\n[project]\nname = \"quotes-api\"\nversion = \"0.4.0\"\ndescription = \"HTTP API that serves price quotes for the checkout\"\nrequires-python = \">=3.12\"\ndependencies = [\"fastapi>=0.115\", \"uvicorn>=0.30\", \"psycopg[binary]>=3.2\"]\n\n[dependency-groups]\ndev = [\"pytest>=8\", \"httpx>=0.27\"]\n\n\n--- uv.lock ---\nversion = 1\n\n\n--- Makefile ---\nrun:\n\tuv run uvicorn quotes.main:app --reload --port 8000\n\ntest:\n\tuv run pytest\n\n\n--- quotes/__init__.py ---\n\n\n--- quotes/main.py ---\nimport os\nfrom fastapi import FastAPI\nimport psycopg\n\nDATABASE_URL = os.environ[\"DATABASE_URL\"]\napp = FastAPI()\n\n@app.get(\"/health\")\ndef health():\n    return {\"ok\": True}\n\n@app.get(\"/quotes/{sku}\")\ndef quote(sku: str):\n    with psycopg.connect(DATABASE_URL) as conn:\n        row = conn.execute(\"select price_cents from prices where sku = %s\", (sku,)).fetchone()\n    return {\"sku\": sku, \"price_cents\": row[0] if row else None}\n\n\n--- tests/test_health.py ---\nfrom fastapi.testclient import TestClient\n\ndef test_health(monkeypatch):\n    monkeypatch.setenv(\"DATABASE_URL\", \"postgresql://localhost/test\")\n    from quotes.main import app\n    assert TestClient(app).get(\"/health\").json() == {\"ok\": True}\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-04",
      "criteria": "Claim: README.md gives the run and test commands as `make run` / `make test` or their exact underlying `uv run ...` commands, uses uv (not pip or poetry) for installing dependencies, and states Python 3.12 or newer.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this service. Include a section on how to deploy it to production, the ops team keeps asking.\n\nThe repository before the run:\n\n--- pyproject.toml ---\n[project]\nname = \"quotes-api\"\nversion = \"0.4.0\"\ndescription = \"HTTP API that serves price quotes for the checkout\"\nrequires-python = \">=3.12\"\ndependencies = [\"fastapi>=0.115\", \"uvicorn>=0.30\", \"psycopg[binary]>=3.2\"]\n\n[dependency-groups]\ndev = [\"pytest>=8\", \"httpx>=0.27\"]\n\n\n--- uv.lock ---\nversion = 1\n\n\n--- Makefile ---\nrun:\n\tuv run uvicorn quotes.main:app --reload --port 8000\n\ntest:\n\tuv run pytest\n\n\n--- quotes/__init__.py ---\n\n\n--- quotes/main.py ---\nimport os\nfrom fastapi import FastAPI\nimport psycopg\n\nDATABASE_URL = os.environ[\"DATABASE_URL\"]\napp = FastAPI()\n\n@app.get(\"/health\")\ndef health():\n    return {\"ok\": True}\n\n@app.get(\"/quotes/{sku}\")\ndef quote(sku: str):\n    with psycopg.connect(DATABASE_URL) as conn:\n        row = conn.execute(\"select price_cents from prices where sku = %s\", (sku,)).fetchone()\n    return {\"sku\": sku, \"price_cents\": row[0] if row else None}\n\n\n--- tests/test_health.py ---\nfrom fastapi.testclient import TestClient\n\ndef test_health(monkeypatch):\n    monkeypatch.setenv(\"DATABASE_URL\", \"postgresql://localhost/test\")\n    from quotes.main import app\n    assert TestClient(app).get(\"/health\").json() == {\"ok\": True}\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
    {
      "type": "llm",
      "name": "check-05",
      "criteria": "Claim: The final message to the user says that the repository has no deployment configuration and that the deployment section is a placeholder or TODO that someone has to fill in.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite a README for this service. Include a section on how to deploy it to production, the ops team keeps asking.\n\nThe repository before the run:\n\n--- pyproject.toml ---\n[project]\nname = \"quotes-api\"\nversion = \"0.4.0\"\ndescription = \"HTTP API that serves price quotes for the checkout\"\nrequires-python = \">=3.12\"\ndependencies = [\"fastapi>=0.115\", \"uvicorn>=0.30\", \"psycopg[binary]>=3.2\"]\n\n[dependency-groups]\ndev = [\"pytest>=8\", \"httpx>=0.27\"]\n\n\n--- uv.lock ---\nversion = 1\n\n\n--- Makefile ---\nrun:\n\tuv run uvicorn quotes.main:app --reload --port 8000\n\ntest:\n\tuv run pytest\n\n\n--- quotes/__init__.py ---\n\n\n--- quotes/main.py ---\nimport os\nfrom fastapi import FastAPI\nimport psycopg\n\nDATABASE_URL = os.environ[\"DATABASE_URL\"]\napp = FastAPI()\n\n@app.get(\"/health\")\ndef health():\n    return {\"ok\": True}\n\n@app.get(\"/quotes/{sku}\")\ndef quote(sku: str):\n    with psycopg.connect(DATABASE_URL) as conn:\n        row = conn.execute(\"select price_cents from prices where sku = %s\", (sku,)).fetchone()\n    return {\"sku\": sku, \"price_cents\": row[0] if row else None}\n\n\n--- tests/test_health.py ---\nfrom fastapi.testclient import TestClient\n\ndef test_health(monkeypatch):\n    monkeypatch.setenv(\"DATABASE_URL\", \"postgresql://localhost/test\")\n    from quotes.main import app\n    assert TestClient(app).get(\"/health\").json() == {\"ok\": True}\n\n</task>",
      "focus": "last_message"
    }
  ],
  "context": {
    "scaffold_script": "scaffold.sh"
  }
}
