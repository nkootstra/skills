    {
      "type": "llm",
      "name": "check-01",
      "criteria": "Claim: README.md says slugkit turns titles or text into URL slugs, in plain terms.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nThis library has no README yet. Write one.\n\nThe repository before the run:\n\n--- pyproject.toml ---\n[project]\nname = \"slugkit\"\nversion = \"1.2.0\"\ndescription = \"Turn titles into URL slugs\"\nrequires-python = \">=3.10\"\nlicense = \"Apache-2.0\"\ndependencies = []\n\n[dependency-groups]\ndev = [\"pytest>=8\"]\n\n[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling.build\"\n\n\n--- uv.lock ---\nversion = 1\nrequires-python = \">=3.10\"\n\n\n--- LICENSE ---\nApache License\nVersion 2.0, January 2004\n\n\n--- src/slugkit/__init__.py ---\n\"\"\"Turn titles into URL slugs.\"\"\"\nimport re\nimport unicodedata\n\n__all__ = [\"slugify\"]\n\n\ndef slugify(text: str, sep: str = \"-\", max_length: int | None = None) -> str:\n    \"\"\"Lowercase, strip accents, and join words with sep. Truncates at a word boundary when max_length is set.\"\"\"\n    ascii_text = unicodedata.normalize(\"NFKD\", text).encode(\"ascii\", \"ignore\").decode()\n    words = re.findall(r\"[a-z0-9]+\", ascii_text.lower())\n    slug = sep.join(words)\n    if max_length is not None and len(slug) > max_length:\n        cut = slug[:max_length]\n        slug = cut.rsplit(sep, 1)[0] if sep in cut else cut\n    return slug\n\n\n--- tests/test_slugify.py ---\nfrom slugkit import slugify\n\n\ndef test_basic():\n    assert slugify(\"Hello, World!\") == \"hello-world\"\n\n\ndef test_accents():\n    assert slugify(\"Crème brûlée\") == \"creme-brulee\"\n\n\ndef test_max_length():\n    assert slugify(\"one two three\", max_length=8) == \"one-two\"\n\n\n--- .github/workflows/ci.yml ---\nname: CI\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    strategy:\n      matrix:\n        python: [\"3.10\", \"3.11\", \"3.12\"]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: astral-sh/setup-uv@v3\n      - run: uv run --python ${{ matrix.python }} pytest\n\n</task>",
      "focus": {
        "source": "file",
        "path": "README.md"
      }
    },
