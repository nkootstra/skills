{
  "schema_version": "1.1",
  "name": "quality-concise-commit-subject",
  "tags": [
    "quality",
    "write-prose",
    "quality-write-prose"
  ],
  "plugins": [
    "../../.."
  ],
  "runs": 1,
  "execution": {
    "prompt": "Write only a concise commit subject for this change: export now quotes fields containing commas so exported CSV keeps the correct number of columns. No issue number or conventional-commit prefix is required.",
    "max_turns": 8,
    "timeout_seconds": 400,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ]
  },
  "graders": [
    {
      "type": "tool_used",
      "name": "loads-skill",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?write-prose\"",
      "min": 1
    },
    {
      "type": "llm",
      "name": "check-01",
      "criteria": "Claim: Returns one concise commit subject describing the CSV quoting fix or its user-visible result.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite only a concise commit subject for this change: export now quotes fields containing commas so exported CSV keeps the correct number of columns. No issue number or conventional-commit prefix is required.\n</task>",
      "focus": "last_message"
    },
    {
      "type": "llm",
      "name": "check-02",
      "criteria": "Claim: Adds no body, invented issue reference, or attribution.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite only a concise commit subject for this change: export now quotes fields containing commas so exported CSV keeps the correct number of columns. No issue number or conventional-commit prefix is required.\n</task>",
      "focus": "last_message"
    },
    {
      "type": "llm",
      "name": "check-03",
      "criteria": "Claim: Does not perform git operations.\n\nJudge only the claim above, against the task below. Pass when it clearly holds; fail when it doesn't.\n\n<task>\nWrite only a concise commit subject for this change: export now quotes fields containing commas so exported CSV keeps the correct number of columns. No issue number or conventional-commit prefix is required.\n</task>",
      "focus": "last_message"
    }
  ]
}
